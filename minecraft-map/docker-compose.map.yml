name: pmc-map-generator

services:
  map-generator:
    user: "${MAP_GENERATOR_UID:-10001}:${MAP_GENERATOR_GID:-10001}"
    build:
      context: ./generator
      dockerfile: Dockerfile
    environment:
      MAP_ARCHIVE: ${MAP_ARCHIVE:-}
      MAP_WORLD_NAME: ${MAP_WORLD_NAME:-world}
      MAP_WORLD_ID: ${MAP_WORLD_ID:-world}
      MAP_WORLD_LABEL: ${MAP_WORLD_LABEL:-Minecraft World}
      MAP_SNAPSHOT_ID: ${MAP_SNAPSHOT_ID:-}
      MAP_SNAPSHOT_LABEL: ${MAP_SNAPSHOT_LABEL:-}
      MAP_SNAPSHOT_CREATED_AT: ${MAP_SNAPSHOT_CREATED_AT:-}
      MAP_PUBLIC_BASE_URL: ${MAP_PUBLIC_BASE_URL:-/minecraft-map}
      MAP_REQUIRE_NFS: ${MAP_REQUIRE_NFS:-false}
      MAP_OUTPUT_FORMAT: ${MAP_OUTPUT_FORMAT:-JAVA_1_21_4}
      MAP_RENDER_MAPS: ${MAP_RENDER_MAPS:-flat,surface}
      MAP_RENDER_MODE: ${MAP_RENDER_MODE:-full}
      MAP_RENDER_RADIUS: ${MAP_RENDER_RADIUS:-512}
      MAP_RENDER_CENTER_X: ${MAP_RENDER_CENTER_X:-0}
      MAP_RENDER_CENTER_Z: ${MAP_RENDER_CENTER_Z:-0}
      MAP_RENDER_THREADS: ${MAP_RENDER_THREADS:-}
      MAP_RENDER_TIMEOUT_SECONDS: ${MAP_RENDER_TIMEOUT_SECONDS:-43200}
      CHUNKER_HEAP: ${CHUNKER_HEAP:-8G}
      PAPER_HEAP: ${PAPER_HEAP:-6G}
      BLUEMAP_ENABLED: ${BLUEMAP_ENABLED:-false}
      BLUEMAP_ACCEPT_DOWNLOAD: ${BLUEMAP_ACCEPT_DOWNLOAD:-false}
      BLUEMAP_RENDER_THREADS: ${BLUEMAP_RENDER_THREADS:-2}
      BLUEMAP_HEAP: ${BLUEMAP_HEAP:-4G}
    volumes:
      - type: bind
        source: ${MAP_ARCHIVE_DIRECTORY:-./input}
        target: /input
        read_only: true
      - ./work:/work
      - type: bind
        source: ${MAP_OUTPUT_DIRECTORY:-./output}
        target: /output
        bind:
          create_host_path: false
    restart: "no"
    init: true
    mem_limit: ${MAP_MEMORY_LIMIT:-12g}
    security_opt:
      - no-new-privileges:true
