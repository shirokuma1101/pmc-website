server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /__map_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /bluemap/maps/ {
        gzip_static always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
